services:
  eshopdb:
    container_name: eshopdb
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=EShopDb
    restart: unless-stopped
    ports:
       - "5431:5432"
    volumes:
       - postgres_eshopdb:/var/lib/postgresql/data

